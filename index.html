<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini mondo 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c;font-family:Arial}canvas{display:block}#hud{position:fixed;top:12px;left:12px;z-index:5;color:#fff;background:#0008;padding:9px 12px;border-radius:10px;font-size:14px}#joy{position:fixed;left:20px;bottom:24px;width:118px;height:118px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff55;z-index:6;touch-action:none}#stick{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffff66;border:1px solid #ffffff88}#look{position:fixed;right:0;top:0;width:60%;height:100%;z-index:4;touch-action:none}#msg{position:fixed;right:12px;bottom:12px;color:#fff;background:#0008;padding:8px 10px;border-radius:8px;font-size:12px;z-index:5}</style></head><body><div id="hud">Mini mondo 3D · Pioggia notturna</div><div id="joy"><div id="stick"></div></div><div id="look"></div><div id="msg">Joystick a sinistra · trascina a destra</div><script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x05070c);scene.fog=new THREE.FogExp2(0x0b1020,.026);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,300);camera.position.set(0,1.7,10);camera.rotation.order='YXZ';const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x6d83b8,0x101018,1));const moon=new THREE.DirectionalLight(0xc7dbff,2);moon.position.set(-20,30,10);scene.add(moon);const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshStandardMaterial({color:0x171a20,roughness:.25,metalness:.4}));ground.rotation.x=-Math.PI/2;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,140),new THREE.MeshStandardMaterial({color:0x0f1116,roughness:.16,metalness:.55}));road.rotation.x=-Math.PI/2;road.position.y=.015;scene.add(road);for(let z=-60;z<=60;z+=10){const m=new THREE.Mesh(new THREE.PlaneGeometry(.18,4),new THREE.MeshBasicMaterial({color:0xe0c86b}));m.rotation.x=-Math.PI/2;m.position.set(0,.03,z);scene.add(m)}for(const x of[-11.5,11.5]){const s=new THREE.Mesh(new THREE.BoxGeometry(5,.35,140),new THREE.MeshStandardMaterial({color:0x474a50,roughness:.8}));s.position.set(x,.17,0);scene.add(s)}const mats=[0x202735,0x28222f,0x1f2b2a].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9}));for(let i=0;i<22;i++){const side=i%2?-1:1,z=-62+i*6.2,w=7+Math.random()*6,h=8+Math.random()*18,d=5+Math.random()*5;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats[i%3]);b.position.set(side*(17+Math.random()*5),h/2,z);scene.add(b);for(let y=2.2;y<h-1;y+=2.2)for(let wz=-d/2+1.2;wz<d/2-1;wz+=2.3){const win=new THREE.Mesh(new THREE.PlaneGeometry(.8,1.1),new THREE.MeshBasicMaterial({color:Math.random()>.5?0xffd88a:0x0b1320}));win.position.set(-side*(w/2+.01),y-h/2,wz);win.rotation.y=side>0?-Math.PI/2:Math.PI/2;b.add(win)}}function lamp(x,z){const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,5.2,10),new THREE.MeshStandardMaterial({color:0x22252b,metalness:.8}));p.position.set(x,2.6,z);scene.add(p);const g=new THREE.Mesh(new THREE.SphereGeometry(.18,12,12),new THREE.MeshBasicMaterial({color:0xffdfa0}));g.position.set(x,5.15,z);scene.add(g);const l=new THREE.PointLight(0xffcc88,25,17,2);l.position.set(x,5,z);scene.add(l)}for(let z=-55;z<=55;z+=14){lamp(-8.8,z);lamp(8.8,z+7)}function car(x,z,r,c){const q=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.65,4.2),new THREE.MeshStandardMaterial({color:c,roughness:.3,metalness:.6}));body.position.y=.7;q.add(body);const cab=new THREE.Mesh(new THREE.BoxGeometry(1.65,.7,2),new THREE.MeshStandardMaterial({color:0x172432,metalness:.5}));cab.position.set(0,1.3,-.15);q.add(cab);q.position.set(x,0,z);q.rotation.y=r;scene.add(q)}car(-4.2,8,.06,0x80151c);car(4.3,-17,Math.PI+.05,0x173d74);car(-4.5,-35,.02,0x5c5c60);for(let i=0;i<18;i++){const p=new THREE.Mesh(new THREE.CircleGeometry(.7+Math.random()*1.6,24),new THREE.MeshStandardMaterial({color:0x0e1724,roughness:.06,metalness:.8,transparent:true,opacity:.82}));p.scale.x=1.5+Math.random();p.rotation.x=-Math.PI/2;p.position.set((Math.random()-.5)*15,.035,(Math.random()-.5)*120);scene.add(p)}const n=6500,pos=new Float32Array(n*3),spd=new Float32Array(n);for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*90;pos[i*3+1]=Math.random()*45;pos[i*3+2]=(Math.random()-.5)*140;spd[i]=18+Math.random()*18}const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(pos,3));const rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0xbad7ff,size:.07,transparent:true,opacity:.75,depthWrite:false}));scene.add(rain);let jx=0,jy=0,jid=null;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function moveStick(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,m=35,len=Math.hypot(dx,dy);if(len>m){dx=dx/len*m;dy=dy/len*m}jx=dx/m;jy=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);moveStick(e.clientX,e.clientY)};joy.onpointermove=e=>{if(e.pointerId===jid)moveStick(e.clientX,e.clientY)};function jr(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}joy.onpointerup=jr;joy.onpointercancel=jr;let lid=null,lx=0,ly=0,yaw=0,pitch=0;const look=document.getElementById('look');look.onpointerdown=e=>{lid=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(lid)};look.onpointermove=e=>{if(e.pointerId!==lid)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.004;pitch=Math.max(-1.25,Math.min(1.25,pitch-dy*.004));camera.rotation.y=yaw;camera.rotation.x=pitch};look.onpointerup=e=>{if(e.pointerId===lid)lid=null};const clock=new THREE.Clock(),fwd=new THREE.Vector3(),right=new THREE.Vector3();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),a=rain.geometry.attributes.position.array;for(let i=0;i<n;i++){a[i*3+1]-=spd[i]*dt;a[i*3]+=2.2*dt;if(a[i*3+1]<0){a[i*3+1]=35+Math.random()*10;a[i*3]=camera.position.x+(Math.random()-.5)*90;a[i*3+2]=camera.position.z+(Math.random()-.5)*140}}rain.geometry.attributes.position.needsUpdate=true;fwd.set(0,0,-1).applyEuler(new THREE.Euler(0,camera.rotation.y,0));right.set(1,0,0).applyEuler(new THREE.Euler(0,camera.rotation.y,0));camera.position.addScaledVector(right,jx*6*dt);camera.position.addScaledVector(fwd,-jy*6*dt);camera.position.y=1.7;camera.position.x=Math.max(-7.4,Math.min(7.4,camera.position.x));camera.position.z=Math.max(-66,Math.min(66,camera.position.z));renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
