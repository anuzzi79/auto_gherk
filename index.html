<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini labirinto 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:12px;left:12px;z-index:3;color:#fff;background:#000a;padding:9px 12px;border-radius:10px;font-size:14px}#help{position:fixed;right:12px;bottom:12px;z-index:3;color:#fff;background:#000a;padding:8px 10px;border-radius:9px;font-size:12px}#joy{position:fixed;left:22px;bottom:28px;width:118px;height:118px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff55;z-index:4;touch-action:none}#stick{position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:#ffffff66;border:1px solid #ffffffaa}#look{position:fixed;right:0;top:0;width:62%;height:100%;z-index:2;touch-action:none}</style></head><body><canvas id="game"></canvas><div id="hud">Mini labirinto 3D</div><div id="joy"><div id="stick"></div></div><div id="look"></div><div id="help">Joystick: avanti/indietro e gira · trascina a destra: guarda</div><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);resize();const map=["111111111111","100000000001","101111011101","100001010001","111101010101","100001000101","101111110101","100000010001","101110011101","100010000001","100000000001","111111111111"];let px=1.5,py=1.5,pa=0;const FOV=Math.PI/3,MAX=20;let jx=0,jy=0,jid=null;const joy=document.getElementById('joy'),stick=document.getElementById('stick');function setJoy(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,m=35,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}jx=dx/m;jy=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);setJoy(e.clientX,e.clientY)};joy.onpointermove=e=>{if(e.pointerId===jid)setJoy(e.clientX,e.clientY)};function resetJoy(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}joy.onpointerup=resetJoy;joy.onpointercancel=resetJoy;let lid=null,lx=0;const look=document.getElementById('look');look.onpointerdown=e=>{lid=e.pointerId;lx=e.clientX;look.setPointerCapture(lid)};look.onpointermove=e=>{if(e.pointerId!==lid)return;const dx=e.clientX-lx;lx=e.clientX;pa+=dx*.006};look.onpointerup=e=>{if(e.pointerId===lid)lid=null};look.onpointercancel=e=>{if(e.pointerId===lid)lid=null};function wall(x,y){const gx=Math.floor(x),gy=Math.floor(y);return gy<0||gy>=map.length||gx<0||gx>=map[0].length||map[gy][gx]==='1'}function move(dt){pa+=jx*2.2*dt;const step=-jy*2.7*dt,nx=px+Math.cos(pa)*step,ny=py+Math.sin(pa)*step;if(!wall(nx,py))px=nx;if(!wall(px,ny))py=ny}function cast(ray){const dx=Math.cos(ray),dy=Math.sin(ray);let d=0;while(d<MAX){d+=.02;const x=px+dx*d,y=py+dy*d;if(wall(x,y))return d*Math.cos(ray-pa)}return MAX}function minimap(){const s=7,ox=canvas.width-map[0].length*s-12,oy=12;ctx.globalAlpha=.78;ctx.fillStyle='#000';ctx.fillRect(ox-5,oy-5,map[0].length*s+10,map.length*s+10);for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){ctx.fillStyle=map[y][x]==='1'?'#ddd':'#26333d';ctx.fillRect(ox+x*s,oy+y*s,s-1,s-1)}ctx.fillStyle='#ff4b4b';ctx.beginPath();ctx.arc(ox+px*s,oy+py*s,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ff4b4b';ctx.beginPath();ctx.moveTo(ox+px*s,oy+py*s);ctx.lineTo(ox+(px+Math.cos(pa)*1.1)*s,oy+(py+Math.sin(pa)*1.1)*s);ctx.stroke();ctx.globalAlpha=1}function draw(){const w=canvas.width,h=canvas.height;const sky=ctx.createLinearGradient(0,0,0,h/2);sky.addColorStop(0,'#12213a');sky.addColorStop(1,'#55738f');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h/2);const floor=ctx.createLinearGradient(0,h/2,0,h);floor.addColorStop(0,'#4b4d50');floor.addColorStop(1,'#121416');ctx.fillStyle=floor;ctx.fillRect(0,h/2,w,h/2);const rays=Math.max(220,Math.floor(w/2)),col=w/rays;for(let i=0;i<rays;i++){const a=pa-FOV/2+(i/rays)*FOV,d=cast(a),hh=Math.min(h*1.4,h/(d*.72)),shade=Math.max(28,220-d*19);ctx.fillStyle=`rgb(${Math.floor(shade)},${Math.floor(shade*.78)},${Math.floor(shade*.56)})`;ctx.fillRect(i*col,(h-hh)/2,col+1,hh)}minimap()}let last=performance.now();function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
